<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juntos Contra o Bullying | Guia e Relato</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js for Admin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Font: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        h1, h2, h3, h4, h5 { font-family: 'Outfit', sans-serif; }
        
        /* Smooth transitions */
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }
        .fade-exit { opacity: 1; }
        .fade-exit-active { opacity: 0; transition: opacity 200ms; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        },
                        accent: {
                            500: '#6366f1', // Indigo
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---
        // Defined inline to avoid CDN compatibility issues with React
        const Icon = ({ children, className, ...props }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width="24" 
                height="24" 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className} 
                {...props}
            >
                {children}
            </svg>
        );

        const Shield = (props) => <Icon {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></Icon>;
        const Heart = (props) => <Icon {...props}><path d="M19 14c1.49-1.28 3.6-2.79 3.6-5.25 0-3.25-3-4.25-6-1.5-3-2.75-6-1.75-6 1.5C10.6 11.21 12.71 12.72 14.21 14" /><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="none" fill="none"/><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" /></Icon>;
        const MessageCircle = (props) => <Icon {...props}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" /></Icon>;
        const Activity = (props) => <Icon {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></Icon>;
        const Users = (props) => <Icon {...props}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;
        const FileText = (props) => <Icon {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><line x1="10" y1="9" x2="8" y2="9" /></Icon>;
        const ChevronRight = (props) => <Icon {...props}><polyline points="9 18 15 12 9 6" /></Icon>;
        const ChevronLeft = (props) => <Icon {...props}><polyline points="15 18 9 12 15 6" /></Icon>;
        const Send = (props) => <Icon {...props}><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></Icon>;
        const LogOut = (props) => <Icon {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></Icon>;
        const BarChart3 = (props) => <Icon {...props}><line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" /></Icon>;
        const AlertOctagon = (props) => <Icon {...props}><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></Icon>;
        const AlertTriangle = (props) => <Icon {...props}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></Icon>;
        const Check = (props) => <Icon {...props}><polyline points="20 6 9 17 4 12" /></Icon>;

        // --- MOCK DATA ---
        const SAMPLE_REPORTS = [
            { id: 1, date: '01/10/2025', parent: 'Maria Silva', student: 'João Silva', grade: '7º Ano B', reason: 'victim', location: 'playground', risk: 'high', status: 'pending', details: 'Exclusão sistemática durante o recreio.', emotion: 8 },
            { id: 2, date: '02/10/2025', parent: 'Carlos Oliveira', student: 'Ana Oliveira', grade: '8º Ano A', reason: 'witness', location: 'corridor', risk: 'medium', status: 'in-progress', details: 'Comentários ofensivos sobre aparência.', emotion: 5 },
            { id: 3, date: '03/10/2025', parent: 'Patricia Santos', student: 'Pedro Santos', grade: '6º Ano C', reason: 'victim', location: 'online', risk: 'high', status: 'pending', details: 'Cyberbullying via WhatsApp.', emotion: 9 },
            { id: 4, date: '04/10/2025', parent: 'Roberto Almeida', student: 'Lucas Almeida', grade: '7º Ano B', reason: 'aggressor', location: 'classroom', risk: 'medium', status: 'closed', details: 'Empurrões na fila da cantina.', emotion: 6 },
            { id: 5, date: '05/10/2025', parent: 'Fernanda Costa', student: 'Mariana Costa', grade: '7º Ano B', reason: 'victim', location: 'bathroom', risk: 'medium', status: 'pending', details: 'Medo de usar o banheiro.', emotion: 7 },
        ];

        // --- COMPONENTS ---

        // 1. HERO / LANDING
        const Landing = ({ onStart, onAdmin }) => (
            <div className="min-h-screen flex flex-col bg-slate-50 relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-64 bg-gradient-to-r from-brand-900 to-brand-700 rounded-b-[3rem] z-0"></div>
                
                <header className="relative z-10 px-6 py-6 flex justify-between items-center max-w-6xl mx-auto w-full text-white">
                    <div className="flex items-center gap-2">
                        <Shield className="w-8 h-8 text-brand-100" />
                        <span className="text-xl font-bold tracking-tight">Escola Segura</span>
                    </div>
                    <button onClick={onAdmin} className="text-sm font-medium text-brand-100 hover:text-white transition">Área Administrativa</button>
                </header>

                <main className="relative z-10 flex-1 flex flex-col items-center justify-center px-6 pb-12 text-center max-w-3xl mx-auto">
                    <div className="bg-white p-8 rounded-2xl shadow-xl mt-8 mb-8 border border-slate-100">
                        <div className="inline-flex items-center justify-center p-3 bg-brand-50 rounded-full mb-6">
                            <Heart className="w-8 h-8 text-brand-600" />
                        </div>
                        <h1 className="text-3xl md:text-5xl font-bold text-slate-900 mb-4 leading-tight">
                            Juntos contra o Bullying
                        </h1>
                        <p className="text-lg text-slate-600 mb-8 leading-relaxed">
                            Nenhuma criança deve enfrentar isso sozinha. Criamos um canal seguro e guiado para você identificar, conversar e relatar ocorrências. Seu apoio é o primeiro passo para a mudança.
                        </p>
                        <div className="flex flex-col sm:flex-row gap-4 justify-center">
                            <button 
                                onClick={onStart}
                                className="px-8 py-4 bg-brand-600 hover:bg-brand-700 text-white text-lg font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2"
                            >
                                Iniciar Guia de Apoio <ChevronRight className="w-5 h-5" />
                            </button>
                        </div>
                        <p className="mt-6 text-sm text-slate-400">
                            Totalmente confidencial • Orientação Profissional
                        </p>
                    </div>
                </main>
            </div>
        );

        // 2. ONBOARDING GUIDE
        const Guide = ({ onComplete, onBack }) => {
            const [step, setStep] = useState(0);
            const steps = [
                {
                    title: "O Momento Certo",
                    desc: "Para criar um ambiente propício ao diálogo, escolha um momento especial.",
                    image: "https://framerusercontent.com/images/flEekjecdaX61MjQSetTtP9Og.jpg",
                    tips: ["Durante um passeio", "Antes de dormir", "Enquanto praticam um hobby"],
                    icon: <Activity className="w-6 h-6" />
                },
                {
                    title: "Porto Seguro",
                    desc: "A forma como você escuta é tão importante quanto o que você diz. Valide os sentimentos.",
                    image: "https://framerusercontent.com/images/k0A1OY9n5Vcd5DkGYmvOuA7eqsI.png",
                    tips: ["Mantenha contato visual", "Não interrompa", "Evite frases como 'não é nada'"],
                    icon: <Shield className="w-6 h-6" />
                },
                {
                    title: "A Pergunta Mágica",
                    desc: "Perguntas abertas permitem que seu filho compartilhe no próprio ritmo.",
                    image: "https://framerusercontent.com/images/WA5UnLqbTWGzeGh3nB6wMV0lqQ.jpg",
                    tips: ["O que foi chato na escola hoje?", "Com quem você gosta de ficar?", "Como você se sente?"],
                    icon: <MessageCircle className="w-6 h-6" />
                },
                {
                    title: "Processamento",
                    desc: "Acolha. Não prometa resolver tudo imediatamente sem um plano estruturado.",
                    image: "https://framerusercontent.com/images/hx8YW4igf4rUYjycWK4Vp2Wvr7o.jpg",
                    tips: ["Agradeça a confiança", "Não julgue", "Diga: 'Vamos resolver juntos'"],
                    icon: <Heart className="w-6 h-6" />
                }
            ];

            const nextStep = () => {
                if (step < steps.length - 1) setStep(step + 1);
                else onComplete();
            };

            const prevStep = () => {
                if (step > 0) setStep(step - 1);
                else onBack();
            };

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 md:p-8">
                    <div className="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[600px]">
                        {/* Image Side */}
                        <div className="w-full md:w-1/2 bg-slate-900 relative">
                            <img 
                                src={steps[step].image} 
                                alt={steps[step].title} 
                                className="absolute inset-0 w-full h-full object-cover opacity-80 transition-opacity duration-500"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
                            <div className="absolute bottom-8 left-8 text-white">
                                <div className="flex items-center gap-3 mb-2">
                                    <div className="p-2 bg-white/20 backdrop-blur-md rounded-lg text-white">
                                        {steps[step].icon}
                                    </div>
                                    <span className="text-sm font-medium uppercase tracking-wider opacity-80">Passo {step + 1} de {steps.length}</span>
                                </div>
                                <h2 className="text-3xl font-bold">{steps[step].title}</h2>
                            </div>
                        </div>

                        {/* Content Side */}
                        <div className="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-between">
                            <div>
                                <div className="flex gap-2 mb-8">
                                    {steps.map((_, i) => (
                                        <div key={i} className={`h-2 flex-1 rounded-full transition-colors duration-300 ${i <= step ? 'bg-brand-600' : 'bg-slate-200'}`}></div>
                                    ))}
                                </div>
                                
                                <h3 className="text-xl font-semibold text-slate-800 mb-4">Orientação</h3>
                                <p className="text-lg text-slate-600 mb-8 leading-relaxed">
                                    {steps[step].desc}
                                </p>

                                <div className="bg-brand-50 rounded-xl p-6 border border-brand-100">
                                    <h4 className="text-brand-800 font-semibold mb-3 flex items-center gap-2">
                                        <Users className="w-4 h-4" /> Dicas Práticas:
                                    </h4>
                                    <ul className="space-y-3">
                                        {steps[step].tips.map((tip, idx) => (
                                            <li key={idx} className="flex items-start gap-3 text-slate-700">
                                                <Check className="w-5 h-5 text-green-500 shrink-0" />
                                                <span>{tip}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            </div>

                            <div className="flex justify-between items-center mt-8 pt-8 border-t border-slate-100">
                                <button onClick={prevStep} className="text-slate-500 hover:text-slate-800 font-medium px-4 py-2 rounded-lg hover:bg-slate-50 transition">
                                    Voltar
                                </button>
                                <button 
                                    onClick={nextStep} 
                                    className="bg-brand-600 hover:bg-brand-700 text-white px-8 py-3 rounded-xl font-semibold shadow-lg hover:shadow-brand-500/30 transition flex items-center gap-2"
                                >
                                    {step === steps.length - 1 ? 'Ir para Relato' : 'Próximo Passo'}
                                    <ChevronRight className="w-5 h-5" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. REPORT FORM
        const ReportForm = ({ onSubmit, onBack }) => {
            const [emotion, setEmotion] = useState(5);
            const [loading, setLoading] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                // Simulate API call
                setTimeout(() => {
                    setLoading(false);
                    onSubmit();
                }, 1500);
            };

            const getEmotionColor = (val) => {
                if (val <= 3) return 'text-green-600';
                if (val <= 7) return 'text-amber-600';
                return 'text-red-600';
            };

            return (
                <div className="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
                    <div className="max-w-3xl mx-auto">
                        <button onClick={onBack} className="mb-6 flex items-center text-slate-500 hover:text-brand-600 transition">
                            <ChevronLeft className="w-5 h-5 mr-1" /> Voltar ao Guia
                        </button>
                        
                        <div className="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
                            <div className="bg-brand-600 p-6 text-white">
                                <h2 className="text-2xl font-bold flex items-center gap-2">
                                    <FileText className="w-6 h-6" /> Formulário de Ocorrência
                                </h2>
                                <p className="text-brand-100 mt-2 opacity-90">Preencha com calma. Suas informações são confidenciais e serão tratadas pela coordenação.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="p-8 grid grid-cols-1 gap-y-6 gap-x-4">
                                <div className="bg-blue-50 p-4 rounded-lg border border-blue-100 mb-2 flex gap-3 items-start">
                                    <Shield className="w-5 h-5 text-blue-600 shrink-0 mt-0.5" />
                                    <p className="text-sm text-blue-800">
                                        Este relato ajuda a escola a agir. Não é necessário ter provas concretas, apenas a sua observação ou o relato da criança.
                                    </p>
                                </div>

                                {/* Identificação */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Seu Nome (Responsável)</label>
                                        <input required type="text" className="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition outline-none" placeholder="Ex: Maria Silva" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Telefone / WhatsApp</label>
                                        <input required type="tel" className="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition outline-none" placeholder="(00) 00000-0000" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Nome do Aluno(a)</label>
                                        <input required type="text" className="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition outline-none" placeholder="Nome completo do aluno" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Turma / Série</label>
                                        <input required type="text" className="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition outline-none" placeholder="Ex: 7º Ano B" />
                                    </div>
                                </div>

                                <div className="border-t border-slate-100 my-2"></div>

                                {/* Detalhes */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Motivo do Contato</label>
                                        <select required className="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                                            <option value="">Selecione...</option>
                                            <option value="victim">Suspeita de Vítima</option>
                                            <option value="aggressor">Comportamento Agressivo</option>
                                            <option value="witness">Testemunhou algo</option>
                                            <option value="other">Outro</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Local da Ocorrência</label>
                                        <select required className="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                                            <option value="">Selecione...</option>
                                            <option value="classroom">Sala de aula</option>
                                            <option value="playground">Pátio/Recreio</option>
                                            <option value="bathroom">Banheiro</option>
                                            <option value="corridor">Corredor</option>
                                            <option value="online">Internet/Redes Sociais</option>
                                            <option value="other">Outro</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-medium text-slate-700 mb-1">Relato Detalhado</label>
                                    <textarea required rows="4" className="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition outline-none" placeholder="Descreva o que aconteceu, o que seu filho(a) disse, nomes envolvidos se souber..."></textarea>
                                </div>

                                {/* Emotional Scale */}
                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                                    <label className="block text-base font-medium text-slate-800 mb-4 text-center">
                                        Em uma escala de 1 a 10, quão angustiado o aluno(a) aparenta estar?
                                    </label>
                                    <div className="flex items-center gap-4">
                                        <span className="text-sm text-slate-500">Tranquilo</span>
                                        <input 
                                            type="range" 
                                            min="1" 
                                            max="10" 
                                            value={emotion} 
                                            onChange={(e) => setEmotion(parseInt(e.target.value))}
                                            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-600"
                                        />
                                        <span className="text-sm text-slate-500">Muito Angustiado</span>
                                    </div>
                                    <div className={`text-center mt-2 font-bold text-2xl ${getEmotionColor(emotion)}`}>
                                        {emotion}
                                    </div>
                                </div>

                                <div>
                                    <div className="flex items-center mb-2">
                                        <input id="psych-support" type="checkbox" className="w-4 h-4 text-brand-600 border-slate-300 rounded focus:ring-brand-500" />
                                        <label htmlFor="psych-support" className="ml-2 text-sm text-slate-700">Autorizo a equipe de psicologia escolar a abordar o aluno(a) para oferecer suporte.</label>
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className={`w-full py-4 rounded-xl text-white font-bold text-lg shadow-lg transition flex justify-center items-center gap-2
                                        ${loading ? 'bg-slate-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 hover:shadow-green-500/30'}`}
                                >
                                    {loading ? 'Enviando...' : (
                                        <>
                                            Enviar Relato Seguro <Send className="w-5 h-5" />
                                        </>
                                    )}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. ADMIN DASHBOARD
        const AdminDashboard = ({ onLogout }) => {
            const [reports, setReports] = useState(SAMPLE_REPORTS);
            const [filter, setFilter] = useState('all');

            // Calculate Stats
            const stats = {
                high: reports.filter(r => r.risk === 'high').length,
                medium: reports.filter(r => r.risk === 'medium').length,
                low: reports.filter(r => r.risk === 'low').length || 0,
                total: reports.length
            };

            const filteredReports = filter === 'all' ? reports : reports.filter(r => r.risk === filter);

            const getRiskBadge = (risk) => {
                const styles = {
                    high: 'bg-red-100 text-red-700 border-red-200',
                    medium: 'bg-amber-100 text-amber-700 border-amber-200',
                    low: 'bg-green-100 text-green-700 border-green-200'
                };
                return (
                    <span className={`px-2 py-1 rounded-full text-xs font-bold uppercase border ${styles[risk] || styles.low}`}>
                        {risk === 'high' ? 'Alto Risco' : risk === 'medium' ? 'Médio' : 'Baixo'}
                    </span>
                );
            };

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    {/* Admin Header */}
                    <header className="bg-slate-900 text-white shadow-lg">
                        <div className="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-indigo-500 rounded-lg">
                                    <BarChart3 className="w-6 h-6 text-white" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold">Radar Escolar</h1>
                                    <p className="text-xs text-slate-400">Painel de Gestão de Convivência</p>
                                </div>
                            </div>
                            <button onClick={onLogout} className="flex items-center gap-2 text-sm font-medium text-slate-300 hover:text-white transition">
                                <LogOut className="w-4 h-4" /> Sair
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl mx-auto px-6 py-8 w-full">
                        {/* Stats Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-red-500"></div>
                                <span className="text-4xl font-bold text-slate-800 mb-1">{stats.high}</span>
                                <span className="text-sm font-medium text-red-600 uppercase tracking-wide flex items-center gap-1">
                                    <AlertOctagon className="w-4 h-4" /> Alto Risco
                                </span>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                                <span className="text-4xl font-bold text-slate-800 mb-1">{stats.medium}</span>
                                <span className="text-sm font-medium text-amber-600 uppercase tracking-wide flex items-center gap-1">
                                    <AlertTriangle className="w-4 h-4" /> Atenção
                                </span>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
                                <span className="text-4xl font-bold text-slate-800 mb-1">{stats.low}</span>
                                <span className="text-sm font-medium text-green-600 uppercase tracking-wide flex items-center gap-1">
                                    <Shield className="w-4 h-4" /> Monitorado
                                </span>
                            </div>
                            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center justify-center relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                                <span className="text-4xl font-bold text-slate-800 mb-1">{stats.total}</span>
                                <span className="text-sm font-medium text-slate-500 uppercase tracking-wide">Total Relatos</span>
                            </div>
                        </div>

                        {/* Main Content Grid */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* Table Section */}
                            <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-slate-800">Relatos Recentes</h3>
                                    <select 
                                        value={filter} 
                                        onChange={(e) => setFilter(e.target.value)}
                                        className="text-sm border-slate-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                                    >
                                        <option value="all">Todos os riscos</option>
                                        <option value="high">Alto Risco</option>
                                        <option value="medium">Médio Risco</option>
                                        <option value="low">Baixo Risco</option>
                                    </select>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm text-slate-600">
                                        <thead className="bg-slate-50 text-slate-900 font-semibold uppercase text-xs">
                                            <tr>
                                                <th className="px-6 py-3">Data</th>
                                                <th className="px-6 py-3">Aluno</th>
                                                <th className="px-6 py-3">Motivo</th>
                                                <th className="px-6 py-3">Risco</th>
                                                <th className="px-6 py-3">Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {filteredReports.map(report => (
                                                <tr key={report.id} className="hover:bg-slate-50 transition">
                                                    <td className="px-6 py-4 font-medium">{report.date}</td>
                                                    <td className="px-6 py-4">
                                                        <div className="text-slate-900 font-medium">{report.student}</div>
                                                        <div className="text-xs text-slate-400">{report.grade}</div>
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        {report.reason === 'victim' ? 'Vítima' : report.reason === 'aggressor' ? 'Agressor' : 'Testemunha'}
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        {getRiskBadge(report.risk)}
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        <button className="text-indigo-600 hover:text-indigo-900 font-medium text-xs border border-indigo-200 px-2 py-1 rounded hover:bg-indigo-50">
                                                            Ver Detalhes
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Visual Analysis Side */}
                            <div className="space-y-6">
                                {/* Location Ranking */}
                                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                                    <h3 className="text-lg font-bold text-slate-800 mb-4">📍 Locais de Ocorrência</h3>
                                    <div className="space-y-4">
                                        {[
                                            { loc: 'Pátio/Recreio', val: 35, color: 'bg-indigo-500' },
                                            { loc: 'Sala de Aula', val: 25, color: 'bg-blue-400' },
                                            { loc: 'Online', val: 20, color: 'bg-purple-400' },
                                            { loc: 'Banheiros', val: 15, color: 'bg-slate-400' },
                                            { loc: 'Outros', val: 5, color: 'bg-slate-200' }
                                        ].map((item, i) => (
                                            <div key={i}>
                                                <div className="flex justify-between text-sm mb-1">
                                                    <span className="text-slate-600 font-medium">{item.loc}</span>
                                                    <span className="text-slate-400">{item.val}%</span>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-2">
                                                    <div className={`h-2 rounded-full ${item.color}`} style={{ width: `${item.val}%` }}></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Quick Actions */}
                                <div className="bg-gradient-to-br from-indigo-600 to-blue-700 p-6 rounded-xl text-white shadow-md">
                                    <h3 className="text-lg font-bold mb-2">Exportar Relatórios</h3>
                                    <p className="text-indigo-100 text-sm mb-4">Baixe os dados compilados para reunião pedagógica.</p>
                                    <button className="w-full bg-white text-indigo-700 font-bold py-2 rounded-lg hover:bg-indigo-50 transition">
                                        Gerar PDF Mensal
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        // 5. SUCCESS SCREEN
        const SuccessScreen = ({ onHome }) => (
            <div className="min-h-screen bg-green-50 flex flex-col items-center justify-center p-6 text-center">
                <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-green-100">
                    <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600">
                        <Check className="w-10 h-10" />
                    </div>
                    <h2 className="text-2xl font-bold text-slate-800 mb-2">Relato Recebido</h2>
                    <p className="text-slate-600 mb-8">
                        Agradecemos por sua coragem e confiança. A equipe escolar já foi notificada e analisará as informações com total sigilo. Entraremos em contato em breve.
                    </p>
                    <button onClick={onHome} className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition">
                        Voltar ao Início
                    </button>
                </div>
            </div>
        );

        // --- MAIN APP LOGIC ---
        const App = () => {
            const [view, setView] = useState('landing'); // landing, guide, form, success, admin

            return (
                <div>
                    {view === 'landing' && (
                        <Landing 
                            onStart={() => setView('guide')} 
                            onAdmin={() => setView('admin')} 
                        />
                    )}
                    {view === 'guide' && (
                        <Guide 
                            onComplete={() => setView('form')} 
                            onBack={() => setView('landing')}
                        />
                    )}
                    {view === 'form' && (
                        <ReportForm 
                            onSubmit={() => setView('success')} 
                            onBack={() => setView('guide')}
                        />
                    )}
                    {view === 'success' && (
                        <SuccessScreen onHome={() => setView('landing')} />
                    )}
                    {view === 'admin' && (
                        <AdminDashboard onLogout={() => setView('landing')} />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
